name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Rebuild on demand — e.g. to pick up a change pushed only to the
  # kowloon-frontend, kowloon-client, or kowloon-design repo, which don't
  # trigger this workflow.
  workflow_dispatch:

jobs:
  # No image is published unless the server's tests pass.
  test:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        # Mongo keeps a file open per collection and index; the default
        # limit runs out with one test database per test file.
        options: >-
          --ulimit nofile=64000:64000
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOMAIN: kwln.org
      MONGO_URI: mongodb://localhost:27017/kowloon
      JWT_SECRET: ci-only-not-a-secret
      RATE_LIMITING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-app:
    name: Build app image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out server
        uses: actions/checkout@v4
        with:
          path: kowloon-server

      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kowloon-frontend
          path: kowloon-frontend

      - name: Check out client library
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kowloon-client
          path: kowloon-client

      - name: Check out design library
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kowloon-design
          path: kowloon-design

      # Images run on 64-bit Intel/AMD and 64-bit ARM (e.g. Raspberry Pi 5).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kowloon
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: kowloon-server/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-setup:
    name: Build setup wizard image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kowloon-setup
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: setup
          file: setup/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # The wizard pins new installs to this exact app version.
          build-args: |
            KOWLOON_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
